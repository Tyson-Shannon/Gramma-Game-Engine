[project]
name = "grain-demo"
schema_version = 1
default_target = "pc"
max_sprites = 1
width = 256
height = 224

# The demo reuses the shared test-kart kart art and imports the track from a
# Tiled map. Grain source is discovered from [grain].sources below.
[[image]]
name = "kart"
file = "../test-kart/assets/kart.png"
kind = "sprite"
bpp = 4
frame_width = 16
frame_height = 16

[[map]]
name = "track"
file = "assets/track.tmx"
layer = "road"
bpp = 4

[[audio]]
name = "engine"
file = "../test-kart/assets/engine.wav"
sample_rate = 22050

[budgets.pc]
rom_kb = 512
vram_tiles = 1024

[budgets.gb]
rom_kb = 32
vram_tiles = 384

[budgets.nes]
rom_kb = 32
vram_tiles = 512

[budgets.sms]
rom_kb = 64
vram_tiles = 512

[target.gb.image.kart]
bpp = 2

[target.gb.map.track]
bpp = 2

[target.nes.image.kart]
bpp = 2

[target.nes.map.track]
bpp = 2

[mapper.nes]
id = "nrom"
prg_banks = 2
chr_banks = 1

[mapper.gb]
id = "none"
rom_banks = 2
ram_banks = 0

[mapper.sms]
rom_banks = 2

# Every .grain file is a translation unit. Remove this table to auto-discover
# src/*.grain instead.
[grain]
sources = ["src/game.grain"]
